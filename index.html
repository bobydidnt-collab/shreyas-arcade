<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Shreyas Arcade: free browser games starring Shreyas, with accounts and leaderboards.">
<title>Shreyas Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: graph-paper notebook page; sticker cards in a responsive grid; game view = top bar + fitted 400x600 canvas (+ side panel). Single light theme by choice. */
:root {
  --paper: #f6f1e3;
  --grid: #cfdcec;
  --ink: #1d1b2e;
  --ink-soft: #5b5870;
  --red: #e2483b;
  --blue: #2f6fd6;
  --yellow: #f5c22e;
  --green: #2f9e5b;
  --orange: #f08a2c;
  --skin: #845032;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
button { font-family: var(--body); cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- hub ---------- */
#hub { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }
.masthead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.masthead canvas { width: 92px; height: 92px; flex: none; }
.masthead h1 { font-family: var(--display); font-weight: normal; font-size: clamp(44px, 8vw, 84px); line-height: .9; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.masthead h1 .sh { color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
.masthead p { margin: 6px 0 0; color: var(--ink-soft); font-size: 17px; max-width: 52ch; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.chip { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; box-shadow: 2px 2px 0 var(--ink); }
.chip b { font-variant-numeric: tabular-nums; }
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; margin-top: 28px; }
.card { position: relative; display: flex; flex-direction: column; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 0; overflow: hidden; color: var(--ink); text-decoration: none; box-shadow: 5px 5px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.card:hover { transform: translate(-2px, -2px) rotate(-.4deg); box-shadow: 7px 7px 0 var(--ink); }
.card:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.card canvas { display: block; width: 100%; aspect-ratio: 3 / 2; border-bottom: 3px solid var(--ink); }
.card .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.card h2 { font-family: var(--display); font-weight: normal; font-size: 24px; margin: 0; line-height: 1.05; }
.card .tag { font-size: 14px; color: var(--ink-soft); line-height: 1.4; }
.card .best { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.card .best b { color: var(--ink); }
.card .badge { position: absolute; top: 10px; right: 10px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.card.horror .badge { background: var(--red); color: #fff; }
.lb { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; text-align: left; }
.lb li { display: grid; grid-template-columns: 30px 1fr auto auto; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--ink); border-radius: 9px; padding: 4px 10px; font-size: 15px; }
.lb li .rk { font-family: var(--display); font-size: 18px; color: var(--ink-soft); }
.lb li:nth-child(1) .rk { color: #c99a10; } .lb li:nth-child(2) .rk { color: #8a8fa0; } .lb li:nth-child(3) .rk { color: #b4703a; }
.lb li .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb li .sc { font-weight: 800; font-variant-numeric: tabular-nums; }
.lb li.me { background: #fff2b8; }
.lb li .x { border: 0; background: none; color: var(--ink-soft); font-size: 16px; padding: 0 2px; line-height: 1; }
.lb li .x:hover { color: var(--red); }
.lb .empty { display: block; text-align: center; color: var(--ink-soft); background: none; border: 2px dashed var(--ink-soft); }
.lbhead { display: flex; align-items: baseline; justify-content: space-between; width: 100%; max-width: 300px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.namebox { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 300px; background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 12px; box-shadow: 3px 3px 0 var(--ink); }
.namebox label { font-weight: 800; font-size: 15px; text-align: left; }
.namebox .row { display: flex; gap: 8px; }
.namebox input { flex: 1; min-width: 0; font: 600 17px var(--body); border: 2px solid var(--ink); border-radius: 9px; padding: 8px 10px; background: var(--paper); color: var(--ink); }
.namebox input:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
.note { font-size: 13px; color: var(--ink-soft); max-width: 32ch; line-height: 1.4; }
.card .champ { font-size: 13px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .champ b { color: var(--ink); }
.btn.lbBtn { background: var(--yellow); }
#lbView { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; }
#lbView h2 { font-family: var(--display); font-weight: normal; font-size: clamp(36px, 6vw, 56px); margin: 0; }
.lbtop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 22px; }
.lbcard { background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lbcard h3 { font-family: var(--display); font-weight: normal; font-size: 22px; margin: 0; }
.lbcard .lb { max-width: none; }
.lbcard .lb li { background: var(--paper); }
.mode { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; max-width: 60ch; line-height: 1.45; }
.acct { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.acct .who { font-weight: 800; }
#authModal { position: fixed; inset: 0; z-index: 50; background: rgba(29,27,46,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.authbox { width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.authbox h3 { font-family: var(--display); font-weight: normal; font-size: 32px; margin: 0; }
.tabs { display: flex; gap: 8px; }
.tabs button { flex: 1; }
.tabs button[aria-selected="true"] { background: var(--yellow); }
.authbox label { font-weight: 800; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.authbox input { font: 600 17px var(--body); border: 2px solid var(--ink); border-radius: 9px; padding: 9px 11px; background: #fff; color: var(--ink); }
.authbox input:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
.authbox .err { color: var(--red); font-weight: 700; font-size: 14px; min-height: 1.2em; margin: 0; }
.authbox .fine { font-size: 13px; color: var(--ink-soft); margin: 0; line-height: 1.4; }
.foot { margin-top: 36px; font-size: 13px; color: var(--ink-soft); }

/* ---------- game view ---------- */
#view { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar { display: flex; align-items: center; gap: 12px; padding-inline: 16px; padding-block: 10px; background: var(--paper); border-bottom: 3px solid var(--ink); flex-wrap: wrap; }
.bar h2 { font-family: var(--display); font-weight: normal; font-size: 26px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 14px; font-size: 15px; font-weight: 600; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.go { background: var(--yellow); }
.btn.big { font-size: 20px; padding: 12px 28px; font-family: var(--display); font-weight: normal; letter-spacing: .02em; }
.score { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
.score span { color: var(--ink-soft); font-weight: 600; }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 14px 16px; }
#canvasBox { position: relative; flex: none; }
#game { display: block; border: 3px solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 6px 6px 0 var(--ink); touch-action: none; }
#overlay { position: absolute; inset: 3px; border-radius: 11px; background: rgba(246,241,227,.94); display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; text-align: center; padding: 16px; overflow-y: auto; }
#overlay h3 { font-family: var(--display); font-weight: normal; font-size: 40px; margin: 0; line-height: 1; }
#overlay p { margin: 0; color: var(--ink-soft); max-width: 30ch; line-height: 1.45; }
#overlay .big-score { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
#overlay .newbest { background: var(--green); color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
#panel { width: 300px; max-height: 100%; overflow-y: auto; background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
#panel h4 { font-family: var(--display); font-weight: normal; font-size: 22px; margin: 0; }
.up { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.up:disabled { opacity: .45; cursor: not-allowed; }
.up:not(:disabled):hover { background: #fff7d6; }
.up b { font-size: 15px; }
.up .own { font-family: var(--display); font-size: 20px; grid-row: span 2; align-self: center; }
.up small { color: var(--ink-soft); font-size: 12px; }
@media (max-width: 760px) {
  #stage { flex-direction: column; gap: 10px; padding: 8px 10px; }
  #panel { width: auto; align-self: stretch; max-height: 34vh; padding: 10px; }
  .bar h2 { font-size: 21px; }
  .bar { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<main id="hub">
  <header class="masthead">
    <canvas id="logo" width="184" height="184" aria-hidden="true"></canvas>
    <div>
      <h1><span class="sh">SHREYAS</span> ARCADE</h1>
      <p>Every game stars Shreyas. Pick one, beat your best, then go back for another.</p>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="acct"><button class="btn big lbBtn" id="lbOpen">🏆 Leaderboards</button><span id="acctBox"></span></div>
  <section id="cards" aria-label="Games"></section>
  <p class="foot" id="footNote"></p>
</main>

<div id="authModal" hidden>
  <form class="authbox" id="authForm" autocomplete="on">
    <h3 id="authTitle">Log in</h3>
    <div class="tabs" role="tablist">
      <button type="button" class="btn" role="tab" id="tabLogin" aria-selected="true">Log in</button>
      <button type="button" class="btn" role="tab" id="tabSignup" aria-selected="false">Sign up</button>
    </div>
    <p class="fine" id="authPending" hidden></p>
    <label>Username<input id="authUser" name="username" autocomplete="username" maxlength="16" required></label>
    <label>Password<input id="authPass" name="password" type="password" autocomplete="current-password" minlength="6" required></label>
    <label id="confirmRow" hidden>Type password again<input id="authPass2" type="password" autocomplete="new-password" minlength="6"></label>
    <p class="err" id="authErr" role="alert"></p>
    <button class="btn go big" type="submit" id="authGo">Log in</button>
    <button class="btn" type="button" id="authCancel">Cancel</button>
    <p class="fine">Usernames are 3–16 letters, numbers or _. There's no email, so remember your password: it can't be reset.</p>
  </form>
</div>

<section id="lbView" hidden>
  <div class="lbtop"><button class="btn" id="lbBack">← Games</button><h2>Leaderboards</h2></div>
  <p class="mode" id="lbMode"></p>
  <div class="lbgrid" id="lbGrid"></div>
</section>

<section id="view" hidden>
  <div class="bar">
    <button class="btn" id="backBtn">← Games</button>
    <h2 id="gameTitle">Game</h2>
    <div class="score" id="scoreBox">Score <b id="scoreNow">0</b> <span>· Best <b id="scoreBest">0</b></span></div>
    <button class="btn" id="restartBtn">Restart</button>
  </div>
  <div id="stage">
    <div id="canvasBox">
      <canvas id="game"></canvas>
      <div id="overlay"></div>
    </div>
    <aside id="panel" hidden></aside>
  </div>
</section>

<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;
const W = 400, H = 600;
const C = { paper: '#f6f1e3', ink: '#1d1b2e', red: '#e2483b', blue: '#2f6fd6', yellow: '#f5c22e', green: '#2f9e5b', orange: '#f08a2c', skin: '#845032', skinDark: '#6a3f26', hair: '#120c08', shirt: '#1c1d22', pants: '#2b3346' };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const HORROR_URL = 'horror.html';

/* ---------------- storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('shreyasArcade.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('shreyasArcade.' + k, JSON.stringify(v)); } catch (e) {} }
};
const bests = store.get('bests', {});
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + u[i];
}

/* ---------------- drawing Shreyas ---------------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); }
// s = head radius in px. opts: mood happy|shock|grin|sad|cool, night (red eyes), look (-1..1), blink
function drawShreyas(c, x, y, s, o) {
  o = o || {};
  c.save(); c.translate(x, y); if (o.rot) c.rotate(o.rot); const k = s / 50; c.scale(k, k);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const ink = C.ink, lw = o.thin ? 2.5 : 3.5;
  // ears
  c.fillStyle = C.skin; c.strokeStyle = ink; c.lineWidth = lw;
  ell(c, -45, 8, 9, 14); c.fill(); c.stroke(); ell(c, 45, 8, 9, 14); c.fill(); c.stroke();
  // face
  c.beginPath(); c.moveTo(-42, -10); c.bezierCurveTo(-44, 30, -30, 58, 0, 58); c.bezierCurveTo(30, 58, 44, 30, 42, -10); c.bezierCurveTo(40, -48, -40, -48, -42, -10); c.closePath();
  c.fillStyle = C.skin; c.fill(); c.stroke();
  // cheek shade
  c.fillStyle = 'rgba(0,0,0,.08)'; ell(c, 26, 30, 12, 9); c.fill(); ell(c, -26, 30, 12, 9); c.fill();
  // slick-back hair
  c.fillStyle = C.hair;
  c.beginPath(); c.moveTo(-44, -4); c.bezierCurveTo(-50, -44, -24, -62, 0, -62); c.bezierCurveTo(24, -62, 50, -44, 44, -4);
  c.bezierCurveTo(40, -20, 30, -28, 22, -30); c.bezierCurveTo(10, -33, -10, -33, -22, -30); c.bezierCurveTo(-30, -28, -40, -20, -44, -4); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 2;
  for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 10, -33); c.quadraticCurveTo(i * 13, -50, i * 9, -60); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.35)'; ell(c, -14, -50, 10, 4); c.fill();
  // brows
  c.strokeStyle = C.hair; c.lineWidth = 6;
  const bl = o.mood === 'shock' ? -6 : o.night ? 4 : 0;
  c.beginPath(); c.moveTo(-30, -13 + bl); c.lineTo(-10, -15 + (o.night ? -bl : bl * 0.4)); c.stroke();
  c.beginPath(); c.moveTo(30, -13 + bl); c.lineTo(10, -15 + (o.night ? -bl : bl * 0.4)); c.stroke();
  // eyes
  const lk = (o.look || 0) * 3;
  [-19, 19].forEach((ex) => {
    if (o.blink || o.mood === 'cool') { c.strokeStyle = ink; c.lineWidth = 3; c.beginPath(); c.moveTo(ex - 6, 3); c.lineTo(ex + 6, 3); c.stroke(); return; }
    c.fillStyle = '#fff'; ell(c, ex, 3, 8, o.mood === 'shock' ? 9 : 7); c.fill();
    c.fillStyle = o.night ? '#ff2a12' : '#2c170b'; ell(c, ex + lk, 4, o.night ? 3 : 4.5, o.night ? 3 : 5); c.fill();
    if (!o.night) { c.fillStyle = '#fff'; ell(c, ex + lk + 1.5, 2, 1.4, 1.4); c.fill(); }
  });
  // glasses (thick, square)
  c.strokeStyle = ink; c.lineWidth = 5;
  rr(c, -35, -9, 31, 24, 5); c.stroke(); rr(c, 4, -9, 31, 24, 5); c.stroke();
  c.beginPath(); c.moveTo(-4, -1); c.lineTo(4, -1); c.stroke();
  c.lineWidth = 3.5; c.beginPath(); c.moveTo(-35, -3); c.lineTo(-44, -1); c.moveTo(35, -3); c.lineTo(44, -1); c.stroke();
  if (o.mood === 'cool') { c.fillStyle = ink; rr(c, -35, -9, 31, 24, 5); c.fill(); rr(c, 4, -9, 31, 24, 5); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.moveTo(-31, -6); c.lineTo(-24, -6); c.lineTo(-30, 8); c.closePath(); c.fill();
  // nose
  c.strokeStyle = C.skinDark; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 8); c.quadraticCurveTo(-6, 22, -2, 25); c.quadraticCurveTo(3, 27, 7, 24); c.stroke();
  // mouth
  c.strokeStyle = ink; c.lineWidth = 3.5;
  const m = o.mood || 'happy';
  if (m === 'shock') { c.fillStyle = '#4a1414'; ell(c, 0, 40, 8, 10); c.fill(); c.stroke(); }
  else if (m === 'sad') { c.beginPath(); c.arc(0, 48, 12, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
  else if (m === 'grin' || o.night) {
    c.fillStyle = '#4a1414'; c.beginPath(); c.moveTo(-20, 33); c.quadraticCurveTo(0, 56, 20, 33); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-17, 34); c.lineTo(17, 34); c.lineTo(15, 39); c.lineTo(-15, 39); c.closePath(); c.fill();
  } else { c.beginPath(); c.arc(0, 30, 13, Math.PI * 0.2, Math.PI * 0.8); c.stroke(); }
  c.restore();
}
// full body: feet at (x,y); s = head radius; pose {run:phase, arms:'up'|'shoot'|'down'}
function drawShreyasBody(c, x, y, s, o) {
  o = o || {};
  const k = s / 50; c.save(); c.translate(x, y); c.scale(k, k); c.lineJoin = 'round'; c.lineCap = 'round';
  const ph = o.run || 0, legA = Math.sin(ph) * 0.6, armA = -Math.sin(ph) * 0.7;
  c.strokeStyle = C.ink; c.lineWidth = 4;
  // legs
  const leg = (a, dx) => { c.save(); c.translate(dx, -95); c.rotate(a); c.fillStyle = C.pants; rr(c, -11, 0, 22, 88, 8); c.fill(); c.stroke(); c.fillStyle = '#111'; rr(c, -13, 80, 32, 15, 6); c.fill(); c.stroke(); c.restore(); };
  leg(-legA, -12); leg(legA, 12);
  // arms behind torso

  const name = $('authUser').value.trim(), pass = $('authPass').value;
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) { $('authErr').textContent = 'Usernames are 3–16 letters, numbers or _ (no spaces).'; return; }
  if (pass.length < 6) { $('authErr').textContent = 'Your password needs at least 6 characters.'; return; }
  if (authMode === 'signup' && pass !== $('authPass2').value) { $('authErr').textContent = 'The two passwords don’t match.'; return; }
  const email = name.toLowerCase() + '@' + EMAIL_DOMAIN;
  $('authGo').disabled = true; $('authErr').textContent = '';
  try {
    if (authMode === 'signup') {
      const cred = await FB.auth.createUserWithEmailAndPassword(email, pass);
      await FB.fs.doc('users/' + cred.user.uid).set({ username: name, createdAt: Date.now() });
      FB.username = name;
    } else {
      await FB.auth.signInWithEmailAndPassword(email, pass);
    }
    await waitForProfile();
    closeAuth();
    if (pending) { const p = pending; pending = null; const r = await saveAccountScore(p.id, p.score); if (authAfter) authAfter(r); }
    refreshBoards();
  } catch (e) { $('authErr').textContent = authError(e); }
  finally { $('authGo').disabled = false; }
};
function waitForProfile() { return new Promise((res) => { const t0 = Date.now(); (function chk() { if ((FB.user && FB.username) || Date.now() - t0 > 4000) res(); else setTimeout(chk, 100); })(); }); }

/* ---------- saving ---------- */
async function saveAccountScore(id, score) {
  score = Math.floor(score);
  if (!FB.user || !(score > 0)) return { ok: false };
  const prev = FB.mine[id] || 0;
  if (score <= prev) return { ok: true, saved: false, best: prev };
  try {
    await FB.fs.doc(`scores/${id}/entries/${FB.user.uid}`).set({ username: FB.username, score, at: Date.now() });
    FB.mine[id] = score; if (bests[id] == null || score > bests[id]) { bests[id] = score; store.set('bests', bests); }
    return { ok: true, saved: true, best: score };
  } catch (e) { return { ok: false, msg: 'Couldn’t save your score. Check your internet and try again.' }; }
}
function rankOf(id) { const b = boardFor(id); const i = FB.user ? b.findIndex((e) => e.id === FB.user.uid) : -1; return i >= 0 ? i + 1 : null; }
function savedMsg(id, r) {
  if (!r.ok) return r.msg || 'Couldn’t save your score.';
  if (!r.saved) return `Saved scores only go up. Your account best is ${fmt(r.best)}.`;
  const rk = rankOf(id);
  return rk ? `Saved! You're #${rk} on the leaderboard.` : 'Saved to your account as your new best!';
}
// What to show under a finished score: auto-save when signed in, ask to sign up when not.
function afterScore(container, id, score, after, isPostButton) {
  score = Math.floor(score);
  if (!FB.on) {
    if (!qualifiesLocal(id, score)) { if (isPostButton) { container.innerHTML = '<span class="note">Not top 10 on this device yet. Keep tapping!</span>'; } after && after(); return; }
    return localNameForm(container, id, score, after);
  }
  if (!(score > 0)) { after && after(); return; }
  if (FB.user) {
    container.innerHTML = '<span class="note">Saving…</span>';
    saveAccountScore(id, score).then((r) => { container.innerHTML = `<span class="note">${esc(savedMsg(id, r))}</span>`; setTimeout(refreshBoards, 400); after && after(); });
    return;
  }
  container.innerHTML = `<div class="namebox"><label>🏆 Save this score?</label><span class="note">Make a free account (or log in) to save your score and get on the leaderboard.</span><div class="row"><button class="btn go" type="button" id="saveSignup">Sign up</button><button class="btn" type="button" id="saveLogin">Log in</button></div></div>`;
  const done = (r) => { container.innerHTML = `<span class="note">${esc(savedMsg(id, r))}</span>`; setTimeout(refreshBoards, 400); after && after(); };
  container.querySelector('#saveSignup').onclick = () => openAuth('signup', { id, score }, done);
  container.querySelector('#saveLogin').onclick = () => openAuth('login', { id, score }, done);
  after && after();
}
function localNameForm(container, id, score, after) {
  container.innerHTML = `<form class="namebox" autocomplete="off"><label for="nameInput">🏆 Top ${LB_SIZE} score! Your name:</label><div class="row"><input id="nameInput" maxlength="16" placeholder="Your name" value="${esc(myName)}" required><button class="btn go" type="submit">Save</button></div><span class="note">Saved on this device.</span></form>`;
  const f = container.querySelector('form'), inp = container.querySelector('#nameInput');
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
  f.onsubmit = (ev) => {
    ev.preventDefault(); const name = cleanName(inp.value); if (!name) return;
    myName = name; store.set('name', name);
    const entry = { name, score, at: Date.now(), id: 'l' + Date.now() };
    localBoards[id] = sortBoard([...(localBoards[id] || []), entry]).slice(0, LB_KEEP); store.set('boards', localBoards);
    lastSaved = { game: id, id: entry.id };
    container.innerHTML = '<span class="note">Saved on this device.</span>'; refreshBoards(); after && after();
  };
}

/* ---------- start Firebase ---------- */
(function initFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !window.firebase) { refreshBoards(); return; }
  try { firebase.initializeApp(cfg); FB.auth = firebase.auth(); FB.fs = firebase.firestore(); FB.on = true; }
  catch (e) { console.warn('Firebase failed to start', e); refreshBoards(); return; }
  FB.auth.onAuthStateChanged(async (u) => {
    FB.user = u; FB.mine = {};
    if (!u) { FB.username = ''; refreshBoards(); return; }
    try { const d = await FB.fs.doc('users/' + u.uid).get(); if (d.exists) FB.username = d.data().username; } catch (e) {}
    if (!FB.username) FB.username = (u.email || '').split('@')[0];
    await Promise.all(GAMES.map(async (g) => {
      try { const d = await FB.fs.doc(`scores/${g.id}/entries/${u.uid}`).get(); if (d.exists) { const v = d.data().score; FB.mine[g.id] = v; if (bests[g.id] == null || v > bests[g.id]) bests[g.id] = v; } } catch (e) {}
    }));
    store.set('bests', bests);
    refreshBoards();
  });
  GAMES.forEach((g) => {
    FB.fs.collection('scores').doc(g.id).collection('entries').orderBy('score', 'desc').limit(LB_SIZE).onSnapshot((snap) => {
      FB.boards[g.id] = snap.docs.map((d) => { const x = d.data(); return { id: d.id, name: x.username, score: x.score, at: x.at }; }).filter(validEntry);
      refreshBoards();
    }, (e) => console.warn('leaderboard', g.id, e && e.code));
  });
  refreshBoards();
})();

/* ======================= SHELL ======================= */
const canvas = $('game'), ctx = canvas.getContext('2d');
let curEnv = null;
let cur = null, inst = null, running = false, scoreNow = 0, last = 0;
function drawThumb(cv, g) { const c = cv.getContext('2d'); const w = cv.width / 2, h = cv.height / 2; c.save(); c.scale(2, 2); g.thumb(c, w, h); c.restore(); }
function buildHub() {
  const box = $('cards'); box.innerHTML = '';
  [...GAMES, HORROR].forEach((g) => {
    const el = document.createElement(g.link ? 'a' : 'button'); el.className = 'card' + (g.link ? ' horror' : '');
    if (g.link) { el.href = g.link; el.target = '_blank'; el.rel = 'noopener'; }
    const best = bests[g.id];
    const top = g.link ? null : boardFor(g.id)[0];
    el.innerHTML = `<canvas width="480" height="320"></canvas><span class="badge">${g.badge}</span><span class="meta"><h2>${g.name}</h2><span class="tag">${g.tag}</span>${g.link ? '<span class="best">Opens in a new tab</span>' : `<span class="best">Your ${g.id === 'clicker' ? 'lifetime' : 'best'}: <b>${best != null ? fmt(best) : '—'}</b></span><span class="champ">🏆 ${top ? `<b>${esc(top.name)}</b> · ${fmt(top.score)}` : 'No champion yet'}</span>`}</span>`;
    if (!g.link) el.onclick = () => openGame(g);
    box.appendChild(el); drawThumb(el.querySelector('canvas'), g);
  });
  const played = Object.keys(bests).length; const total = Object.values(bests).reduce((a, b) => a + (typeof b === 'number' ? b : 0), 0);
  $('stats').innerHTML = `<span class="chip">${GAMES.length + 1} games</span><span class="chip">Played <b>${played}</b> of ${GAMES.length}</span>`;
  const lc = $('logo').getContext('2d'); lc.clearRect(0, 0, 184, 184); lc.fillStyle = C.yellow; lc.strokeStyle = C.ink; lc.lineWidth = 6; lc.beginPath(); lc.arc(92, 92, 86, 0, TAU); lc.fill(); lc.stroke(); drawShreyas(lc, 92, 98, 58, { mood: 'grin' });
}
function fit() {
  if (!cur) return;
  const stage = $('stage'), panelOn = !$('panel').hidden, narrow = window.innerWidth <= 760;
  let aw = stage.clientWidth - 32, ah = stage.clientHeight - 28;
  if (panelOn) { if (narrow) ah -= Math.min(window.innerHeight * 0.34, 260) + 10; else aw -= 318; }
  const s = Math.max(0.3, Math.min(aw / W, ah / H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.floor(W * s) + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.floor(W * s * dpr); canvas.height = Math.floor(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener('resize', fit);
function setBest(id, v) { if (bests[id] == null || v > bests[id]) { bests[id] = v; store.set('bests', bests); return true; } return false; }
function overlay(html) { const o = $('overlay'); if (html == null) { o.hidden = true; return; } o.innerHTML = html; o.hidden = false; }
function startInstance() {
  if (inst && inst.destroy) inst.destroy();
  scoreNow = 0; $('scoreNow').textContent = '0';
  const env = {
    panel: $('panel'),
    score(v) { scoreNow = v; $('scoreNow').textContent = fmt(v); if (cur.id === 'clicker') { setBest('clicker', Math.floor(v)); $('scoreBest').textContent = fmt(bests.clicker || 0); } },
    over(v) {
      if (!running) return; running = false;
      const nb = setBest(cur.id, v); $('scoreBest').textContent = fmt(bests[cur.id] || 0);
      const lines = ['Shreyas believes in you.', 'Shreyas has seen worse. Barely.', 'Shreyas adjusts his glasses. Again?', 'Shreyas wants a rematch.', 'Shreyas is proud of you.'];
      const gid = cur.id; lastSaved = null;
      overlay(`<h3>Game over</h3><div class="big-score">${fmt(v)}</div>${nb && v > 0 ? '<span class="newbest">New personal best</span>' : `<p>Your best: ${fmt(bests[gid] || 0)}</p>`}<div id="nameSlot" style="width:100%;display:flex;justify-content:center"><p>${lines[Math.floor(Math.random() * lines.length)]}</p></div><div class="lbhead"><span>Top ${LB_SIZE}</span><span>${esc(cur.scoreLabel || 'Score')}</span></div><div id="liveBoard" style="width:100%;display:flex;justify-content:center">${boardHTML(gid, myId())}</div><button class="btn go big" id="againBtn">Play again</button>`);
      $('againBtn').onclick = () => { startInstance(); begin(); };
      afterScore($('nameSlot'), gid, v, () => $('againBtn').focus());
    }
  };
  curEnv = env;
  inst = cur.create(env);
  fit();
}
function begin() { overlay(null); running = true; last = performance.now(); canvas.focus && canvas.focus(); }
function openGame(g) {
  cur = g; $('hub').hidden = true; $('view').hidden = false; $('gameTitle').textContent = g.name;
  $('scoreBest').textContent = fmt(bests[g.id] || 0);
  startInstance();
  if (g.noOverlay) begin();
  else { running = false; overlay(`<h3>${g.name}</h3><p>${g.howto}</p><button class="btn go big" id="startBtn">Play</button>`); $('startBtn').onclick = begin; $('startBtn').focus(); }
  window.scrollTo(0, 0);
}
function closeGame() { if (inst && inst.destroy) inst.destroy(); inst = null; cur = null; running = false; $('view').hidden = true; $('hub').hidden = false; buildHub(); }
$('backBtn').onclick = closeGame;
$('restartBtn').onclick = () => { if (!cur) return; if (cur.id === 'clicker') return; startInstance(); begin(); };

function pt(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
canvas.addEventListener('pointerdown', (e) => { if (!running || !inst) return; canvas.setPointerCapture(e.pointerId); const [x, y] = pt(e); inst.down && inst.down(x, y); e.preventDefault(); });
canvas.addEventListener('pointermove', (e) => { if (!running || !inst) return; const [x, y] = pt(e); inst.move && inst.move(x, y); });
canvas.addEventListener('pointerup', (e) => { if (!running || !inst) return; const [x, y] = pt(e); inst.up && inst.up(x, y); });
canvas.addEventListener('pointercancel', () => { if (inst && inst.up) inst.up(); });
const GAME_KEYS = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
window.addEventListener('keydown', (e) => {
  if (!cur) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Escape') { closeGame(); return; }
  if (!running) { if ((e.code === 'Space' || e.code === 'Enter') && !$('overlay').hidden && document.activeElement && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); } return; }
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  inst && inst.key && inst.key(e.code, true);
});
window.addEventListener('keyup', (e) => { if (running && inst && inst.key) inst.key(e.code, false); });

function loop(now) {
  requestAnimationFrame(loop);
  if (!cur || !inst) return;
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (running) inst.update(dt);
  ctx.save(); inst.draw(ctx); ctx.restore();
}
requestAnimationFrame(loop);
buildHub();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildHub);
window.__arcade = { GAMES, openGame, closeGame, begin, endWith: (v) => curEnv && curEnv.over(v), get inst() { return inst; } };
})();
</script>
